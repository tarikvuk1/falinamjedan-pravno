<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fali vam jedan? · Jedan</title>
<meta property="og:title" content="Fali nam jedan! Uskoči u termin 🟢">
<meta property="og:description" content="Otvori termin u aplikaciji Jedan i prijavi se.">
<style>
  :root { --bg:#0a0c0b; --card:#141917; --fg:#f2f5f3; --muted:#8c9590; --green:#22c55e; --line:#1e2421; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
         font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { width:100%; max-width:420px; text-align:center; }
  .mark { width:72px; height:72px; margin:0 auto 18px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px; }
  .mark span { border-radius:50%; background:var(--green); }
  .mark span:last-child { background:rgba(34,197,94,.12); border:4px dashed var(--green); }
  h1 { font-size:30px; line-height:1.15; margin:0 0 8px; letter-spacing:-.5px; }
  h1 em { font-style:normal; color:var(--green); }
  p { color:var(--muted); margin:0 0 24px; }
  .btn { display:block; width:100%; padding:16px; border-radius:14px; background:var(--green); color:#0a0c0b;
         font-weight:800; font-size:17px; text-decoration:none; }
  .card { margin-top:22px; padding:16px; border-radius:16px; background:var(--card); border:1px solid var(--line); font-size:15px; color:var(--muted); }
  .card strong { color:var(--fg); }
</style>
</head>
<body><main>
  <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <h1>Fali im <em>jedan.</em><br>Možda baš ti?</h1>
  <p>Neko je podijelio termin s tobom. Otvori ga u aplikaciji Jedan i prijavi se u par sekundi.</p>
  <a id="open" class="btn" href="#">Otvori termin u aplikaciji</a>
  <div class="card">
    <strong>Nemaš aplikaciju?</strong><br>
    Jedan uskoro stiže na App Store i Google Play. Zaprati
    <a href="https://instagram.com/jedan.app" style="color:var(--green)">@jedan.app</a> da saznaš prvi.
  </div>
</main>
<script>
  // Prihvatamo samo ispravan ID termina (UUID), da link ne može otvoriti ništa drugo
  var id = new URLSearchParams(location.search).get('id') || '';
  var ok = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
  var link = ok ? 'falinamjedan://game/' + id : 'falinamjedan://';
  document.getElementById('open').setAttribute('href', link);
  if (ok) setTimeout(function () { location.href = link; }, 300);
</script>
</body></html>
